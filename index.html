<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario | Taller de Vidrio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(to bottom, rgba(10, 15, 20, 0.75), rgba(5, 8, 12, 0.95)),
                        url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header { text-align: center; margin-bottom: 40px; max-width: 800px; }
        h1 { font-family: 'Playfair Display', serif; font-size: 3.2rem; font-weight: 500; color: #ffffff; margin-bottom: 10px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .subtitle { color: #94a3b8; font-size: 1rem; font-weight: 300; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.1);
            width: 100%;
            max-width: 950px;
            margin-bottom: 30px;
        }
        .search-bar-container {
            background: rgba(240, 244, 248, 0.9);
            border-radius: 12px;
            padding: 5px 15px;
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .search-bar-container svg { width: 20px; height: 20px; fill: #64748b; margin-right: 10px; }
        .search-bar-container input { flex: 1; background: transparent; border: none; padding: 15px 0; font-size: 1.05rem; color: #1e293b; outline: none; }
        form { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-size: 0.8rem; color: #cbd5e1; margin-bottom: 8px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-input, select {
            background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 16px; border-radius: 8px; color: #fff; font-size: 0.95rem; outline: none;
        }
        select option { background-color: #0f172a; color: #fff; }
        .btn-group { grid-column: 1 / -1; display: flex; gap: 15px; margin-top: 10px; }
        .btn-submit {
            background: linear-gradient(90deg, #629c88, #477e85); color: #fff; border: none;
            padding: 14px 24px; border-radius: 10px; font-weight: 500; font-size: 1rem; cursor: pointer; flex: 1;
            box-shadow: 0 4px 15px rgba(98, 156, 136, 0.3); transition: all 0.3s;
        }
        .btn-submit:hover { transform: translateY(-2px); background: linear-gradient(90deg, #6caba6, #508e96); }
        .btn-cancel {
            background: rgba(255, 255, 255, 0.05); color: #e2e8f0; border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 14px 24px; border-radius: 10px; cursor: pointer; display: none;
        }
        .section-title { font-size: 0.9rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .section-title::before { content: ''; width: 8px; height: 8px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 10px #22c55e; }
        .table-container { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 16px 12px; text-align: left; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 0.9rem; }
        th { color: #64748b; font-weight: 500; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1px; }
        tr:hover { background: rgba(255, 255, 255, 0.03); }
        td { color: #f1f5f9; }
        .id-col { color: #64748b; }
        .actions { display: flex; gap: 12px; }
        .action-btn { background: transparent; border: none; cursor: pointer; opacity: 0.6; transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
        .action-btn:hover { opacity: 1; transform: scale(1.1); }
        .action-btn svg { width: 18px; height: 18px; }
        .edit-btn:hover svg { fill: #38bdf8; }
        .delete-btn:hover svg { fill: #f87171; }
        .minus-btn:hover svg { fill: #fbbf24; } /* Color amarillo para el boton de despacho */
    </style>
</head>
<body>

    <header>
        <h1>Control de Inventario</h1>
        <p class="subtitle">Taller de Vidrio</p>
    </header>

    <div class="glass-panel">
     

        <h2 class="section-title" id="form-title">Nuevo Material</h2>
        
        <form id="vidrio-form">
            <input type="hidden" id="vidrio-id">
            
            <div class="form-group">
                <label for="tipo">Tipo</label>
                <select id="tipo" required>
                    <option value="">Seleccione una opción</option>
                    <option value="Transparente">Transparente</option>
                    <option value="Flotado">Flotado</option>
                    <option value="Ojo de buey">Ojo de buey</option>
                    <option value="Antireflejo">Antireflejo</option>
                    <option value="Espejo">Espejo</option>
                    <option value="Reflectivo">Reflectivo</option>
                    <option value="Nevado">Nevado</option>

                </select>
            </div>

            <div class="form-group">
                <label for="color">Color</label>
                <input type="text" id="color" class="form-input" placeholder="Claro, Bronce, Gris..." required>
            </div>

            <div class="form-group">
                <label for="grosor">Grosor (mm)</label>
                <input type="number" id="grosor" class="form-input" min="1" placeholder="Ej. 4" required>
            </div>

            <div class="form-group">
                <label for="dimensiones">Dimensiones</label>
                <input type="text" id="dimensiones" class="form-input" placeholder="2.44m x 1.65m" required>
            </div>

            <div class="form-group">
                <label for="cantidad">Stock Inicial</label>
                <input type="number" id="cantidad" class="form-input" min="0" placeholder="Unidades" required>
            </div>

            <div class="form-group">
                <label for="fecha_ingreso">Fecha de Ingreso</label>
                <input type="date" id="fecha_ingreso" class="form-input" required>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn-submit" id="btn-guardar">Procesar Registro</button>
                <button type="button" class="btn-cancel" id="btn-cancelar" onclick="resetearFormulario()">Cancelar Edición</button>
            </div>
        </form>
    </div>

    <div class="glass-panel">
        <h2 class="section-title">Inventario Activo</h2>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tipo</th>
                        <th>Color</th>
                        <th>Grosor</th>
                        <th>Dimensiones</th>
                        <th>Fecha Ingreso</th> <th>Stock</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-vidrios">
                </tbody>
            </table>
        </div>
    </div>

<script>
    // Conservamos tu excelente deteccion automatica de IP
    const API_URL = 'http://' + window.location.hostname + ':8080';

    document.addEventListener("DOMContentLoaded", () => {
        establecerFechaHoy();
        cargarInventario();
    });
    
    document.getElementById("vidrio-form").addEventListener("submit", guardarDatos);

    // Coloca automaticamente la fecha del dia de hoy en el calendario
    function establecerFechaHoy() {
        const hoy = new Date().toISOString().split('T')[0];
        document.getElementById("fecha_ingreso").value = hoy;
    }

    async function cargarInventario() {
        try {
            const response = await fetch(`${API_URL}/vidrios`);
            const vidrios = await response.json();
            
            const tbody = document.getElementById("tabla-vidrios");
            tbody.innerHTML = ""; 

            if(vidrios.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; color:#64748b; padding: 30px;">La base de datos está vacía</td></tr>`;
                return;
            }

            vidrios.forEach(v => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td class="id-col">#${v.id}</td>
                    <td style="font-weight: 500;">${v.tipo}</td>
                    <td>${v.color}</td>
                    <td>${v.grosor_mm} mm</td>
                    <td>${v.dimensiones}</td>
                    <td>${v.fecha_ingreso}</td>
                    <td style="font-weight: 600; color: ${v.cantidad < 3 ? '#f87171' : '#cbd5e1'}">${v.cantidad} unds</td>
                    <td class="actions">
                        <button class="action-btn minus-btn" title="Despachar 1 Plancha" onclick="disminuirStock(${v.id}, ${v.cantidad})">
                            <svg viewBox="0 0 24 24" fill="#94a3b8"><path d="M19 13H5v-2h14v2z"/></svg>
                        </button>
                        <button class="action-btn edit-btn" title="Editar" onclick="prepararEdicion(${v.id}, '${v.tipo}', '${v.color}', ${v.grosor_mm}, '${v.dimensiones}', ${v.cantidad}, '${v.fecha_ingreso}')">
                            <svg viewBox="0 0 24 24" fill="#94a3b8"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                        </button>
                        <button class="action-btn delete-btn" title="Eliminar" onclick="eliminarVidrio(${v.id})">
                            <svg viewBox="0 0 24 24" fill="#94a3b8"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (error) {
            console.error("Error de conexión:", error);
        }
    }

    // NUEVA FUNCIÓN: Disminuye la cantidad directamente en C++
    async function disminuirStock(id, cantidadActual) {
        if (cantidadActual <= 0) {
            alert("Operacion cancelada: El material seleccionado ya no tiene existencias disponibles.");
            return;
        }

        const nuevaCantidad = cantidadActual - 1;
        // Enviamos unicamente el campo 'cantidad' aprovechando la actualizacion parcial del C++
        const actualizacionParcial = { cantidad: nuevaCantidad };

        try {
            const response = await fetch(`${API_URL}/vidrio/${id}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(actualizacionParcial)
            });

            if (response.ok) {
                cargarInventario(); // Recarga la tabla con los nuevos datos
            } else {
                alert("No se pudo modificar el stock en el servidor.");
            }
        } catch (error) {
            console.error("Error al despachar el material:", error);
        }
    }

    async function guardarDatos(e) {
        e.preventDefault();

        const id = document.getElementById("vidrio-id").value;
        const tipo = document.getElementById("tipo").value;
        const color = document.getElementById("color").value;
        const grosor_mm = parseInt(document.getElementById("grosor").value);
        const dimensiones = document.getElementById("dimensiones").value;
        const cantidad = parseInt(document.getElementById("cantidad").value);
        const fecha_ingreso = document.getElementById("fecha_ingreso").value;

        const datos = { tipo, color, grosor_mm, dimensiones, cantidad, fecha_ingreso };

        try {
            let response;
            if (id) {
                response = await fetch(`${API_URL}/vidrio/${id}`, { 
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(datos)
                });
            } else {
                response = await fetch(`${API_URL}/vidrio`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(datos)
                });
            }

            if (response.ok) {
                resetearFormulario();
                cargarInventario();
            }
        } catch (error) {
            console.error("Error:", error);
        }
    }

    async function eliminarVidrio(id) {
        if (!confirm("¿Confirma la eliminación de este material?")) return;
        try {
            const response = await fetch(`${API_URL}/vidrio/${id}`, { method: "DELETE" });
            if (response.ok || response.status === 204) cargarInventario();
        } catch (error) { console.error("Error:", error); }
    }

    function prepararEdicion(id, tipo, color, grosor, dimensiones, cantidad, fecha) {
        document.getElementById("vidrio-id").value = id;
        document.getElementById("tipo").value = tipo;
        document.getElementById("color").value = color;
        document.getElementById("grosor").value = grosor;
        document.getElementById("dimensiones").value = dimensiones;
        document.getElementById("cantidad").value = cantidad;
        document.getElementById("fecha_ingreso").value = fecha;

        document.getElementById("form-title").innerHTML = `Actualizando Material <span style="color:#38bdf8">#${id}</span>`;
        document.getElementById("btn-guardar").innerText = "Guardar Cambios";
        document.getElementById("btn-cancelar").style.display = "block";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetearFormulario() {
        document.getElementById("vidrio-form").reset();
        document.getElementById("vidrio-id").value = "";
        document.getElementById("form-title").innerText = "Nuevo Material";
        document.getElementById("btn-guardar").innerText = "Procesar Registro";
        document.getElementById("btn-cancelar").style.display = "none";
        establecerFechaHoy();
    }

    function filtrarTabla() {
        const input = document.getElementById("buscador").value.toLowerCase();
        const filas = document.querySelectorAll("#tabla-vidrios tr");
        filas.forEach(fila => {
            const textoFila = fila.innerText.toLowerCase();
            fila.style.display = textoFila.includes(input) ? "" : "none";
        });
    }
</script>
</body>
</html>
